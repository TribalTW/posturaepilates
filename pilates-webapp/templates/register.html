<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postura & Pilates - Registrazione</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#fff9fb] min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white border border-[#f9d1df] p-6 rounded-2xl shadow-xl">
        <h1 class="text-2xl font-bold text-[#880E4F] text-center mb-1">Postura & Pilates</h1>
        <p class="text-xs text-center text-gray-500 mb-6">Crea il tuo account paziente</p>

        {% if error %}
            <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-2 rounded-xl mb-4 text-xs text-center">
                {{ error }}
            </div>
        {% endif %}

        <form action="/registrati" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Nome</label>
                <input type="text" name="nome" required class="w-full p-2.5 border border-[#f2c2d5] rounded-xl outline-none focus:border-[#D81B60]">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Cognome</label>
                <input type="text" name="cognome" required class="w-full p-2.5 border border-[#f2c2d5] rounded-xl outline-none focus:border-[#D81B60]">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Codice Fiscale</label>
                <input type="text" name="cf" required maxlength="16" class="w-full p-2.5 border border-[#f2c2d5] rounded-xl outline-none focus:border-[#D81B60] uppercase">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Password</label>
                <input type="password" name="password" required class="w-full p-2.5 border border-[#f2c2d5] rounded-xl outline-none focus:border-[#D81B60]">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Conferma Password</label>
                <input type="password" name="conferma_password" required class="w-full p-2.5 border border-[#f2c2d5] rounded-xl outline-none focus:border-[#D81B60]">
            </div>
            <button type="submit" class="w-full bg-gradient-to-r from-[#D81B60] to-[#AD1457] text-white font-bold py-3 rounded-xl shadow-md hover:opacity-95 transition">
                Registrati
            </button>
        </form>

        <div class="mt-6 pt-4 border-t border-[#f9d1df] text-center">
            <p class="text-xs text-gray-600 mb-2">Hai già un account?</p>
            <a href="/" class="inline-block w-full text-center border border-[#D81B60] text-[#D81B60] font-semibold py-2.5 rounded-xl hover:bg-[#fff0f5] transition text-xs">
                Torna al Login
            </a>
        </div>
    </div>
</body>
</html>
