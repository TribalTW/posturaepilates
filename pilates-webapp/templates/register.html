<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postura & Pilates - Registrazione</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-serif-title { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="bg-[#fff9fb] min-h-screen flex items-center justify-center p-4 md:p-8">

    <!-- CARD PRINCIPALE CENTRALE -->
    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl border border-[#f9d1df] p-8 md:p-10 relative">

        <!-- Logo dello Studio -->
        <div class="mb-6 flex justify-center">
                <img src="https://github.com/TribalTW/posturaepilates/blob/main/pilates-webapp/static/css/logo.png?raw=true" 
                     alt="Logo Postura & Pilates" 
                     class="h-20 md:h-40 w-auto object-contain">
            </div>

        <!-- Testata Brand -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-serif-title font-bold text-pink-900 tracking-tight">Crea un Account</h1>
            <p class="text-xs font-medium text-[#D81B60] mt-1">Registrati per prenotare le tue lezioni</p>
            <div class="flex items-center justify-center gap-3 mt-3 text-[#f9d1df]">
                <div class="h-[1px] w-8 bg-[#f9d1df]"></div>
                <span class="text-xs text-[#D81B60]">♥</span>
                <div class="h-[1px] w-8 bg-[#f9d1df]"></div>
            </div>
        </div>

        <!-- Messaggio di Errore (se presente) -->
        {% if error %}
        <div class="bg-red-50 border border-red-200 text-red-700 text-xs p-3 rounded-xl mb-4 text-center">
            ⚠️ {{ error }}
        </div>
        {% endif %}

        <!-- Form di Registrazione -->
        <form action="/registrati" method="POST" class="space-y-3.5">
            
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Nome</label>
                    <input type="text" name="nome" required placeholder="Mario" 
                           class="w-full px-3.5 py-2.5 border border-[#f2c2d5] rounded-xl text-xs bg-[#faf6f8] text-gray-800 focus:outline-none focus:border-[#D81B60] focus:bg-white transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Cognome</label>
                    <input type="text" name="cognome" required placeholder="Rossi" 
                           class="w-full px-3.5 py-2.5 border border-[#f2c2d5] rounded-xl text-xs bg-[#faf6f8] text-gray-800 focus:outline-none focus:border-[#D81B60] focus:bg-white transition">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Email</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400 text-xs">✉️</span>
                    <input type="email" name="email" required placeholder="mario.rossi@esempio.it" 
                           class="w-full pl-9 pr-3 py-2.5 border border-[#f2c2d5] rounded-xl text-xs bg-[#faf6f8] text-gray-800 focus:outline-none focus:border-[#D81B60] focus:bg-white transition">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Codice Fiscale</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400 text-xs">🆔</span>
                    <input type="text" name="codice_fiscale" maxlength="16" required placeholder="RSSMRA80A01H501W" 
                           class="w-full pl-9 pr-3 py-2.5 border border-[#f2c2d5] rounded-xl text-xs uppercase bg-[#faf6f8] text-gray-800 focus:outline-none focus:border-[#D81B60] focus:bg-white transition">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400 text-xs">🔒</span>
                    <input type="password" name="password" id="regPassword" required placeholder="••••••••" 
                           class="w-full pl-9 pr-9 py-2.5 border border-[#f2c2d5] rounded-xl text-xs bg-[#faf6f8] text-gray-800 focus:outline-none focus:border-[#D81B60] focus:bg-white transition">
                    <button type="button" onclick="toggleRegPassword()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 text-xs">
                        👁️
                    </button>
                </div>
            </div>

            <button type="submit" 
                    class="w-full mt-2 py-3 bg-gradient-to-r from-[#D81B60] to-[#AD1457] hover:opacity-95 text-white font-bold rounded-xl text-xs transition shadow-md cursor-pointer">
                Completa Registrazione
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-gray-500 border-t border-[#f9d1df]/60 pt-4">
            Hai già un account? <a href="/login" class="text-[#D81B60] font-semibold hover:underline">Accedi qui</a>
        </div>

    </div>

    <!-- Script per mostrare/nascondere la password -->
    <script>
        function toggleRegPassword() {
            const pwdInput = document.getElementById('regPassword');
            pwdInput.type = pwdInput.type === 'password' ? 'text' : 'password';
        }
    </script>
</body>
</html>
