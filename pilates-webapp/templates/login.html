<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accedi - Studio Postura & Pilates</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center relative overflow-x-hidden font-sans">

    <!-- BOTTONE APERTURA TENDINA ADMIN (IN ALTO A SINISTRA) -->
    <button onclick="toggleAdminPanel()" 
            class="fixed top-4 left-4 z-50 bg-slate-800 hover:bg-slate-900 text-white text-xs font-semibold px-3.5 py-2.5 rounded-xl shadow-md flex items-center gap-2 transition-all hover:scale-105 cursor-pointer">
        <span>⚙️ Accesso Admin</span>
    </button>

    <!-- TENDINA / PANNELLO LATERALE ADMIN (SLIDE DA SINISTRA) -->
    <div id="adminDrawer" 
         class="fixed top-0 left-0 h-full w-80 bg-slate-900 text-white z-50 transform -translate-x-full transition-transform duration-300 ease-in-out shadow-2xl p-6 flex flex-col justify-between">
        <div>
            <!-- Header Tendina -->
            <div class="flex justify-between items-center mb-8 border-b border-slate-700 pb-4">
                <h2 class="text-base font-bold flex items-center gap-2 text-slate-100">
                    <span>🔒</span> Area Riservata Admin
                </h2>
                <button onclick="toggleAdminPanel()" class="text-slate-400 hover:text-white text-xl font-bold p-1">&times;</button>
            </div>

            <!-- Messaggio Errore Admin -->
            {% if admin_error %}
            <div class="bg-red-500/20 border border-red-500 text-red-200 text-xs p-3 rounded-lg mb-4">
                ⚠️ {{ admin_error }}
            </div>
            {% endif %}

            <!-- Form Credenziali Admin -->
            <form action="/admin/login" method="POST" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Username / Email Admin</label>
                    <input type="text" name="username" required placeholder="Inserisci username" 
                           class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Password Admin</label>
                    <input type="password" name="password" required placeholder="••••••••" 
                           class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:border-blue-500">
                </div>
                <button type="submit" 
                        class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 font-semibold rounded-lg text-sm text-white transition shadow-md">
                    Accedi al Pannello Admin
                </button>
            </form>
        </div>

        <div class="text-[11px] text-slate-500 text-center border-t border-slate-800 pt-4">
            Riservato alla Dott.ssa Roberta Sinagra
        </div>
    </div>

    <!-- OVERLAY SFONDO SCURO (Chiude la tendina cliccando fuori) -->
    <div id="adminOverlay" onclick="toggleAdminPanel()" class="fixed inset-0 bg-black/50 z-40 hidden transition-opacity"></div>

    <!-- FORM LOGIN UTENTE CLIENTE (AL CENTRO DELLA PAGINA) -->
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-200 m-4">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">Benvenuto</h1>
            <p class="text-xs text-slate-500 mt-1">Accedi per prenotare la tua lezione</p>
        </div>

        {% if error %}
        <div class="bg-red-50 border border-red-200 text-red-700 text-xs p-3 rounded-lg mb-4 text-center">
            ⚠️ {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Nome</label>
                <input type="text" name="nome" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Cognome</label>
                <input type="text" name="cognome" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Password</label>
                <input type="password" name="password" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <button type="submit" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg text-sm transition shadow">
                Accedi
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-slate-500">
            Non hai ancora un account? <a href="/registrati" class="text-blue-600 font-semibold hover:underline">Registrati qui</a>
        </div>
    </div>

    <!-- JAVASCRIPT APERTURA / CHIUSURA TENDINA -->
    <script>
        function toggleAdminPanel() {
            const drawer = document.getElementById('adminDrawer');
            const overlay = document.getElementById('adminOverlay');
            drawer.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        // Se c'è un errore di accesso admin, apre automaticamente la tendina all'avvio
        {% if admin_error %}
        toggleAdminPanel();
        {% endif %}
    </script>
</body>
</html>
