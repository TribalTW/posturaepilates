<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postura e Pilates - Accesso</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #fdf2f8; min-height: 100vh; padding: 20px; display: flex; justify-content: center; align-items: center; }
        .container { background: #ffffff; width: 100%; max-width: 400px; padding: 24px; border-radius: 16px; box-shadow: 0 4px 20px rgba(225, 29, 72, 0.08); }
        
        .brand-header { text-align: center; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid #f3e8ff; }
        .brand-title { font-size: 18px; font-weight: 700; color: #831843; letter-spacing: 0.5px; text-transform: uppercase; }

        h1 { font-size: 18px; font-weight: 700; color: #4c0519; margin-bottom: 20px; text-align: center; }
        
        .alert-success { background: #fdf2f8; border: 1px solid #fbcfe8; color: #831843; padding: 12px; border-radius: 8px; font-size: 14px; margin-bottom: 16px; text-align: center; }
        .alert-error { background: #fff1f2; border: 1px solid #fecdd3; color: #9f1239; padding: 12px; border-radius: 8px; font-size: 14px; margin-bottom: 16px; text-align: center; }

        .form-group { margin-bottom: 16px; text-align: left; }
        label { display: block; font-size: 13px; font-weight: 600; color: #9d174d; margin-bottom: 6px; }
        input[type="text"], input[type="password"] {
            width: 100%; padding: 10px 12px; border: 1.5px solid #fbcfe8; border-radius: 8px; font-size: 15px; background: #fff1f2; outline: none; transition: all 0.2s; color: #4c0519;
        }
        input:focus { border-color: #e11d48; background: #fff; box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.12); }

        .btn-submit { width: 100%; padding: 12px; background: #e11d48; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; margin-top: 8px; }
        .btn-submit:hover { background: #be123c; }

        .link-container { text-align: center; margin-top: 16px; font-size: 14px; color: #881337; }
        .link-container a { color: #e11d48; text-decoration: none; font-weight: 600; }
        .link-container a:hover { text-decoration: underline; }

        .admin-section { margin-top: 24px; border-top: 1px dashed #fbcfe8; padding-top: 16px; text-align: center; }
        .admin-toggle { background: none; border: none; color: #9d174d; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: underline; }
        .admin-box { margin-top: 12px; display: {% if open_admin %}block{% else %}none{% endif %}; }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand-header">
            <div class="brand-title">Postura e Pilates</div>
        </div>

        <h1>Accedi al tuo Account</h1>

        {% if success %}
            <div class="alert-success">✅ {{ success }}</div>
        {% endif %}
        {% if error %}
            <div class="alert-error">⚠️ {{ error }}</div>
        {% endif %}

        <form action="/login" method="POST">
            <div class="form-group">
                <label for="nome">Nome</label>
                <input type="text" name="nome" id="nome" required placeholder="Inserisci il tuo nome">
            </div>
            <div class="form-group">
                <label for="cognome">Cognome</label>
                <input type="text" name="cognome" id="cognome" required placeholder="Inserisci il tuo cognome">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" required placeholder="Inserisci la password">
            </div>
            <button type="submit" class="btn-submit">Accedi</button>
        </form>

        <div class="link-container">
            Non hai un account? <a href="/registrati">Registrati qui</a>
        </div>

        <div class="admin-section">
            <button type="button" class="admin-toggle" onclick="toggleAdmin()">Accesso Amministratore</button>
            <div id="adminBox" class="admin-box">
                {% if admin_error %}
                    <div class="alert-error" style="margin-bottom: 10px; font-size: 13px;">⚠️ {{ admin_error }}</div>
                {% endif %}
                <form action="/admin/login" method="POST">
                    <div class="form-group" style="text-align: left;">
                        <label for="username">Username Admin</label>
                        <input type="text" name="username" id="username" placeholder="Username">
                    </div>
                    <div class="form-group" style="text-align: left;">
                        <label for="password_admin">Password Admin</label>
                        <input type="password" name="password" id="password_admin" placeholder="Password">
                    </div>
                    <button type="submit" class="btn-submit" style="background: #831843;">Login Admin</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        function toggleAdmin() {
            const box = document.getElementById('adminBox');
            box.style.display = box.style.display === 'none' || box.style.display === '' ? 'block' : 'none';
        }
    </script>
</body>
</html>
