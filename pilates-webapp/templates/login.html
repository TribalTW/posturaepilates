<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postura & Pilates - Accedi</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#fff9fb] min-h-screen flex items-center justify-center relative overflow-x-hidden font-sans p-4">

    <!-- BOTTONE APERTURA TENDINA ADMIN (IN ALTO A SINISTRA) -->
    <button onclick="toggleAdminPanel()" 
            class="fixed top-4 left-4 z-50 bg-[#880E4F] hover:bg-[#AD1457] text-white text-xs font-semibold px-3.5 py-2.5 rounded-xl shadow-md flex items-center gap-2 transition-all hover:scale-105 cursor-pointer">
        <span>⚙️ Accesso Admin</span>
    </button>

    <!-- TENDINA / PANNELLO LATERALE ADMIN (SLIDE DA SINISTRA) -->
    <div id="adminDrawer" 
         class="fixed top-0 left-0 h-full w-80 bg-slate-900 text-white z-50 transform -translate-x-full transition-transform duration-300 ease-in-out shadow-2xl p-6 flex flex-col justify-between">
        <div>
            <!-- Header Tendina -->
            <div class="flex justify-between items-center mb-8 border-b border-slate-700 pb-4">
                <h2 class="text-base font-bold flex items-center gap-2 text-slate-100">
                    <span>🔒</span> Area Riservata Admin
                </h2>
                <button onclick="toggleAdminPanel()" class="text-slate-400 hover:text-white text-xl font-bold p-1">&times;</button>
            </div>

            <!-- Messaggio Errore Admin -->
            {% if admin_error %}
            <div class="bg-red-500/20 border border-red-500 text-red-200 text-xs p-3 rounded-lg mb-4">
                ⚠️ {{ admin_error }}
            </div>
            {% endif %}

            <!-- Form Credenziali Admin -->
            <form action="/admin/login" method="POST" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Username / Email Admin</label>
                    <input type="text" name="username" required placeholder="Inserisci username" 
                           class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:border-[#D81B60]">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Password Admin</label>
                    <input type="password" name="password" required placeholder="••••••••" 
                           class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:border-[#D81B60]">
                </div>
                <button type="submit" 
                        class="w-full py-2.5 bg-gradient-to-r from-[#D81B60] to-[#AD1457] hover:opacity-95 font-semibold rounded-lg text-sm text-white transition shadow-md">
                    Accedi al Pannello Admin
                </button>
            </form>
        </div>

        <div class="text-[11px] text-slate-500 text-center border-t border-slate-800 pt-4">
            Riservato alla Dott.ssa Roberta Sinagra
        </div>
    </div>

    <!-- OVERLAY SFONDO SCURO -->
    <div id="adminOverlay" onclick="toggleAdminPanel()" class="fixed inset-0 bg-black/50 z-40 hidden transition-opacity"></div>

    <!-- FORM LOGIN UTENTE CLIENTE (AL CENTRO DELLA PAGINA) -->
    <div class="max-w-md w-full bg-white border border-[#f9d1df] p-6 rounded-2xl shadow-xl">
        <h1 class="text-2xl font-bold text-[#880E4F] text-center mb-1">Postura & Pilates</h1>
        <p class="text-xs text-center text-gray-500 mb-6">Accedi per prenotare la tua lezione</p>

        {% if error %}
            <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-2 rounded-xl mb-4 text-xs text-center">
                ⚠️ {{ error }}
            </div>
        {% endif %}

        <form action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Nome</label>
                <input type="text" name="nome" required class="w-full p-2.5 border border-[#f2c2d5] rounded-xl outline-none focus:border-[#D81B60]">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Cognome</label>
                <input type="text" name="cognome" required class="w-full p-2.5 border border-[#f2c2d5] rounded-xl outline-none focus:border-[#D81B60]">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Password</label>
                <input type="password" name="password" required class="w-full p-2.5 border border-[#f2c2d5] rounded-xl outline-none focus:border-[#D81B60]">
            </div>
            <button type="submit" class="w-full bg-gradient-to-r from-[#D81B60] to-[#AD1457] text-white font-bold py-3 rounded-xl shadow-md hover:opacity-95 transition">
                Accedi
            </button>
        </form>

        <div class="mt-6 pt-4 border-t border-[#f9d1df] text-center">
            <p class="text-xs text-gray-600 mb-2">Non hai ancora un account?</p>
            <a href="/registrati" class="inline-block w-full text-center border border-[#D81B60] text-[#D81B60] font-semibold py-2.5 rounded-xl hover:bg-[#fff0f5] transition text-xs">
                Registrati qui
            </a>
        </div>
    </div>

    <!-- JAVASCRIPT APERTURA / CHIUSURA TENDINA -->
    <script>
        function toggleAdminPanel() {
            const drawer = document.getElementById('adminDrawer');
            const overlay = document.getElementById('adminOverlay');
            drawer.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        {% if admin_error or open_admin %}
        toggleAdminPanel();
        {% endif %}
    </script>
</body>
</html>
