<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check-in Presenza</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#fff9fb] min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white border border-[#f9d1df] p-6 rounded-2xl shadow-xl text-center">
        <h1 class="text-xl font-bold text-[#880E4F] mb-4">Postura & Pilates - Check-In</h1>
        
        {% if success %}
            <div class="bg-green-100 border border-green-400 text-green-800 p-4 rounded-xl text-sm font-semibold mb-4">
                ✓ {{ success }}
            </div>
        {% endif %}

        {% if error %}
            <div class="bg-red-100 border border-red-400 text-red-800 p-4 rounded-xl text-sm font-semibold mb-4">
                ✕ {{ error }}
            </div>
        {% endif %}

        <a href="/prenota" class="inline-block bg-[#D81B60] text-white font-bold py-2.5 px-6 rounded-xl text-xs hover:bg-[#AD1457]">
            Torna all'area personale
        </a>
    </div>
</body>
</html>
