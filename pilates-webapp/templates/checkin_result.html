<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postura & Pilates - Esito Check-in</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-serif-title { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="bg-[#fff9fb] min-h-screen flex items-center justify-center p-4 md:p-8">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl border border-[#f9d1df] overflow-hidden p-6 md:p-8 text-center">
        
        <!-- Brand Header -->
        <div class="mb-6">
            <h1 class="text-2xl font-serif-title font-bold text-pink-900 tracking-tight">Postura & Pilates</h1>
            <p class="text-xs text-gray-500 mt-1">Esito Check-In Presenza</p>
        </div>
        
        <!-- Messaggio di Successo -->
        {% if success %}
            <div class="bg-green-50 border border-green-200 text-green-700 text-xs p-3 rounded-xl mb-6 text-center shadow-sm">
                ✅ {{ success }}
            </div>
        {% endif %}

        <!-- Messaggio di Errore -->
        {% if error %}
            <div class="bg-red-50 border border-red-200 text-red-700 text-xs p-3 rounded-xl mb-6 text-center shadow-sm">
                ⚠️ {{ error }}
            </div>
        {% endif %}

        <!-- Bottone di Ritorno -->
        <a href="/prenota" class="inline-block w-full py-3 bg-gradient-to-r from-[#D81B60] to-[#AD1457] text-white font-bold rounded-xl text-xs hover:opacity-95 transition shadow-md cursor-pointer">
            Torna all'area personale
        </a>
        
    </div>
</body>
</html>
