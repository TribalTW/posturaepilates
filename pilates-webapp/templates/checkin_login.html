<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postura & Pilates - Check-in Presenza</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#fff9fb] min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white border border-[#f9d1df] p-6 rounded-2xl shadow-xl text-center">
        
        <!-- Icon Wrapper -->
        <div class="w-12 h-12 bg-[#fff0f5] text-[#D81B60] border border-[#f9d1df] rounded-full flex items-center justify-center mx-auto mb-4 text-xl shadow-sm">
            📍
        </div>

        <!-- Brand Header -->
        <h1 class="text-2xl font-bold text-[#880E4F] mb-1">Postura & Pilates</h1>
        <p class="text-xs text-gray-500 mb-6">Check-in Presenza: Inserisci le tue credenziali per confermare l'arrivo alla lezione.</p>

        <!-- Errore -->
        {% if error %}
        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-2 rounded-xl mb-4 text-xs text-center">
            ⚠️ {{ error }}
        </div>
        {% endif %}

        <!-- Form -->
        <form action="/checkin" method="POST" class="space-y-4 text-left">
            <div>
                <label for="nome" class="block text-xs font-semibold text-gray-700 mb-1">Nome</label>
                <input type="text" id="nome" name="nome" required placeholder="Inserisci il tuo nome" 
                       class="w-full p-2.5 border border-[#f2c2d5] rounded-xl outline-none focus:border-[#D81B60] text-sm bg-white">
            </div>
            <div>
                <label for="cognome" class="block text-xs font-semibold text-gray-700 mb-1">Cognome</label>
                <input type="text" id="cognome" name="cognome" required placeholder="Inserisci il tuo cognome" 
                       class="w-full p-2.5 border border-[#f2c2d5] rounded-xl outline-none focus:border-[#D81B60] text-sm bg-white">
            </div>
            <div>
                <label for="password" class="block text-xs font-semibold text-gray-700 mb-1">Password</label>
                <input type="password" id="password" name="password" required placeholder="••••••••" 
                       class="w-full p-2.5 border border-[#f2c2d5] rounded-xl outline-none focus:border-[#D81B60] text-sm bg-white">
            </div>
            <button type="submit" 
                    class="w-full bg-gradient-to-r from-[#D81B60] to-[#AD1457] text-white font-bold py-3 rounded-xl shadow-md hover:opacity-95 transition text-sm cursor-pointer">
                Conferma Presenza
            </button>
        </form>

    </div>
</body>
</html>
