<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postura & Pilates - Prenota Appuntamento</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#fff9fb] min-h-screen flex items-center justify-center p-4">
    <div class="max-w-lg w-full bg-white border border-[#f9d1df] p-6 rounded-2xl shadow-xl">
        
        <!-- INTESTAZIONE UTENTE E LOGOUT -->
        <div class="flex justify-between items-center mb-6 border-b border-[#f9d1df] pb-4">
            <div>
                <h1 class="text-xl font-bold text-[#880E4F]">Postura & Pilates</h1>
                <p class="text-xs text-gray-500">Benvenuto/a, <span class="font-semibold text-gray-700">{{ user.nome }} {{ user.cognome }}</span></p>
            </div>
            <a href="/logout" class="text-xs text-red-600 hover:text-red-800 font-semibold border border-red-200 bg-red-50 px-3 py-1.5 rounded-lg transition">
                Esci
            </a>
        </div>

        <!-- NOTIFICHE DI ERRORE -->
        {% if error %}
            <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-xl mb-4 text-xs text-center font-medium">
                {{ error }}
            </div>
        {% endif %}

        <!-- NOTIFICHE DI SUCCESSO CON DOWNLOAD CALENDARIO -->
        {% if success %}
            <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded-xl mb-4 text-xs text-center font-medium">
                <p class="mb-2">{{ success }}</p>
                {% if ultimo_trattamento and ultima_data and ultima_ora %}
                    <a href="/download-ics?trattamento={{ ultimo_trattamento }}&data={{ ultima_data }}&ora={{ ultima_ora }}" 
                       class="inline-block bg-green-600 text-white font-bold py-1.5 px-3 rounded-lg shadow text-xs hover:bg-green-700 transition mt-1">
                        📅 Aggiungi al Calendario (.ics)
                    </a>
                {% endif %}
            </div>
        {% endif %}

        <!-- FORM PRENOTAZIONE -->
        <form action="/prenota" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Seleziona Trattamento</label>
                <select name="trattamento" required class="w-full p-2.5 border border-[#f2c2d5] rounded-xl outline-none focus:border-[#D81B60] bg-white text-xs">
                    <option value="" disabled selected>-- Scegli un trattamento --</option>
                    <option value="Pilates Individuale">Pilates Individuale</option>
                    <option value="Ginnastica Posturale">Ginnastica Posturale</option>
                    <option value="Valutazione Posturale Iniziale">Valutazione Posturale Iniziale</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Data Appuntamento</label>
                <input type="date" name="data" id="data_input" required class="w-full p-2.5 border border-[#f2c2d5] rounded-xl outline-none focus:border-[#D81B60] text-xs">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Orari Disponibili</label>
                <select name="ora" id="ora_select" required disabled class="w-full p-2.5 border border-[#f2c2d5] rounded-xl outline-none focus:border-[#D81B60] bg-white text-xs">
                    <option value="">Seleziona prima una data</option>
                </select>
            </div>

            <button type="submit" class="w-full bg-gradient-to-r from-[#D81B60] to-[#AD1457] text-white font-bold py-3 rounded-xl shadow-md hover:opacity-95 transition text-xs">
                Conferma Prenotazione
            </button>
        </form>

    </div>

    <!-- SCRIPT PER CARICARE GLI ORARI DINAMICAMENTE DALL'API FASTAPI -->
    <script>
        const dataInput = document.getElementById('data_input');
        const oraSelect = document.getElementById('ora_select');

        // Imposta la data minima selezionabile ad oggi
        const today = new Date().toISOString().split('T')[0];
        dataInput.setAttribute('min', today);

        dataInput.addEventListener('change', async function() {
            const selectedData = this.value;
            if (!selectedData) return;

            oraSelect.disabled = true;
            oraSelect.innerHTML = '<option value="">Caricamento orari in corso...</option>';

            try {
                const response = await fetch(`/api/orari?data=${selectedData}`);
                const data = await response.json();

                oraSelect.innerHTML = '';
                if (data.orari && data.orari.length > 0) {
                    oraSelect.disabled = false;
                    data.orari.forEach(ora => {
                        const option = document.createElement('option');
                        option.value = ora;
                        option.textContent = ora;
                        oraSelect.appendChild(option);
                    });
                } else {
                    oraSelect.innerHTML = '<option value="">Nessun orario disponibile per questa data</option>';
                }
            } catch (error) {
                console.error('Errore durante il recupero degli orari:', error);
                oraSelect.innerHTML = '<option value="">Errore nel caricamento orari</option>';
            }
        });
    </script>
</body>
</html>
