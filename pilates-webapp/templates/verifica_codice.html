<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postura & Pilates - Nuova Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-serif-title { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="bg-[#fff9fb] min-h-screen flex items-center justify-center p-4 md:p-8">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl border border-[#f9d1df] overflow-hidden p-6 md:p-8">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-serif-title font-bold text-pink-900 tracking-tight">Imposta Nuova Password</h1>
            <p class="text-xs text-gray-500 mt-1">Inserisci il codice ricevuto via email e la nuova password</p>
        </div>

        {% if error %}
        <div class="bg-red-50 border border-red-200 text-red-700 text-xs p-3 rounded-xl mb-4 text-center">
            ⚠️ {{ error }}
        </div>
        {% endif %}

        <form action="/verifica-codice" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Codice di Verifica (6 cifre)</label>
                <input type="text" name="codice" required placeholder="123456" maxlength="6" 
                       class="w-full px-3.5 py-2.5 border border-[#f2c2d5] rounded-xl text-xs bg-[#faf6f8] text-gray-800 focus:outline-none focus:border-[#D81B60] focus:bg-white transition tracking-widest text-center font-bold">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Nuova Password</label>
                <input type="password" name="nuova_password" required placeholder="••••••••" 
                       class="w-full px-3.5 py-2.5 border border-[#f2c2d5] rounded-xl text-xs bg-[#faf6f8] text-gray-800 focus:outline-none focus:border-[#D81B60] focus:bg-white transition">
            </div>

            <button type="submit" 
                    class="w-full py-3 bg-gradient-to-r from-[#D81B60] to-[#AD1457] hover:opacity-95 text-white font-bold rounded-xl text-xs transition shadow-md cursor-pointer">
                Aggiorna Password
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-gray-500">
            <a href="/login" class="text-[#D81B60] font-semibold hover:underline">← Torna al login</a>
        </div>
    </div>
</body>
</html>
